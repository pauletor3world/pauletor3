# Template do server.properties. O setup.sh copia este arquivo só se ainda não existir
# um server.properties na VM. Depois disso, edite o de /opt/minecraft/server.
# motd, server-port e rcon.* são sempre reaplicados pelo setup.sh a partir do config.env.
#
# MODO OFFLINE: aceita jogadores sem conta original (TLauncher etc.). Sem whitelist:
# o acesso é restrito pela rede privada do Tailscale. Decida isso ANTES do primeiro boot,
# porque o UUID dos jogadores (inventário, posição) muda entre online e offline.
motd=__MOTD__
server-port=25565
online-mode=false
enforce-secure-profile=false
white-list=false
enforce-whitelist=false
max-players=5
difficulty=normal
gamemode=survival
view-distance=10
simulation-distance=8
enable-rcon=true
rcon.port=25575
rcon.password=__RCON_PASSWORD__
broadcast-rcon-to-ops=false
enable-query=false
